name: PR Reviewer Synopsis

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  synopsis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install package
        run: python -m pip install -e .

      - name: Run unit tests
        id: unit-tests
        run: |
          set -e
          python -m unittest discover -s tests -v

      - name: Verify plan guardrails
        id: guardrails
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/check_agentic_guardrails.py \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA" \
            --diff-mode merge-base

      - name: Generate and publish human reviewer synopsis
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info("No pull_request payload found.");
              return;
            }

            const testsOutcome = "${{ steps.unit-tests.outcome }}";
            const guardrailsOutcome = "${{ steps.guardrails.outcome }}";
            const testsBadge = testsOutcome === "success" ? "✅ Passed" : "❌ Failed";
            const guardrailsBadge = guardrailsOutcome === "success" ? "✅ Passed" : "❌ Failed";

            const prBody = pr.body || "";

            function extractSection(body, headingRegex) {
              const match = body.match(headingRegex);
              if (!match) return "_Not specified in PR description._";
              return match[1].trim();
            }

            const synopsis = extractSection(prBody, /##\s*📋?\s*Synopsis of Changes\s*\n([\s\S]*?)(?=\n##|\Z)/i);
            const endResult = extractSection(prBody, /##\s*🎯?\s*Expected End Result\s*\n([\s\S]*?)(?=\n##|\Z)/i);
            const verification = extractSection(prBody, /##\s*🧪?\s*Verification & Test Results\s*\n([\s\S]*?)(?=\n##|\Z)/i);

            const commentHeader = "<!-- pr-synopsis-comment -->";
            const summaryMarkdown = [
              commentHeader,
              "## 🔍 Pull Request Synopsis for Reviewers",
              "",
              "| Check | Status |",
              "| :--- | :--- |",
              `| **Automated Tests** | ${testsBadge} |`,
              `| **Plan Guardrails** | ${guardrailsBadge} |`,
              `| **PR Author** | @${pr.user.login} |`,
              `| **Target Branch** | \`${pr.base.ref}\` ⬅️ \`${pr.head.ref}\` |`,
              "",
              "### 📋 What Has Been Done",
              synopsis,
              "",
              "### 🎯 Expected End Result vs. Delivered Result",
              endResult,
              "",
              "### 🧪 How It Has Been Verified",
              verification,
              "",
              "---",
              "*Automated reviewer synopsis generated by GitHub Actions.*"
            ].join("\n");

            // 1. Output to Step Summary
            await core.summary.addRaw(summaryMarkdown).write();

            // 2. Post or update PR comment
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });

              const existing = comments.find(c => c.body && c.body.includes(commentHeader));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: summaryMarkdown,
                });
                core.info(`Updated existing reviewer synopsis comment (ID: ${existing.id}).`);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: summaryMarkdown,
                });
                core.info("Created new reviewer synopsis comment on PR.");
              }
            } catch (err) {
              core.warning("Could not post PR comment (check permissions): " + err.message);
            }
