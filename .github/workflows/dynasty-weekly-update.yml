name: Weekly Dynasty Update

on:
  schedule:
    - cron: '0 14 * * 3'
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          
      - name: Install dependencies
        run: python -m pip install -e .
        
      - name: Download Previous State
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_RUN=$(gh run list --workflow "dynasty-weekly-update.yml" --status success --json databaseId -q ".[0].databaseId" || echo "")
          if [ -n "$LAST_RUN" ]; then
            gh run download $LAST_RUN -n dynasty-state -D state/rosters/ || echo "No state artifact found."
          fi

      - name: Run update check
        id: update_check
        run: python scripts/check_dynasty_updates.py
        
      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dynasty-update-report
          path: dynasty_update_report.md

      - name: Upload State Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dynasty-state
          path: state/rosters/sleeper_dynasty_*_state.json
