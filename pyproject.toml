[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nflcompanion"
version = "0.1.0"
description = "NFL fantasy draft companion state and provider adapters"
requires-python = ">=3.14"
dependencies = [
    "espn-api>=0.38.1"
]

[tool.setuptools.packages.find]
where = ["src"]
